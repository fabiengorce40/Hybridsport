name: REKKA ESSAI controle final lecture seule
on:
  push:
    branches: [codex/rekka-continuation-20261027]
    paths: ['.github/workflows/rekka-android-access-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Controler les projets sans ecriture
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CF_ACCOUNT']+'/pages/projects/'
          def project(name):
              req=urllib.request.Request(base+name,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as r: d=json.load(r)
              assert d['success']
              return d['result']
          beta=project('rekka-beta'); test=project('rekka-v2-android-test')
          assert beta['subdomain']!=test['subdomain']
          assert beta['canonical_deployment']['created_on']<'2026-10-28T22:45:48Z'
          assert beta['canonical_deployment']['deployment_trigger']['metadata']['commit_hash'].startswith('bc19fb1')
          assert test['canonical_deployment']['deployment_trigger']['metadata']['commit_hash']=='f45c242c1e13a780d9c46084cf15ff6991707a62'
          assert test['canonical_deployment']['environment']=='production'
          assert not test.get('source')
          for cfg in test.get('deployment_configs',{}).values():
              for key in ('env_vars','kv_namespaces','d1_databases','r2_buckets','services'):
                  assert not cfg.get(key)
          print('OK BETA: deploiement anterieur et commit bc19fb1 conserve')
          print('OK ESSAI: projet independant, sans bindings ni integration Git')
          print('URL: https://'+test['subdomain'])
          PY
