name: REKKA ESSAI correction full bleed isolee
on:
  push:
    branches: [codex/rekka-android-icon-fullbleed]
    paths: ['.github/workflows/rekka-android-fullbleed.yml']
permissions:
  contents: read
concurrency:
  group: rekka-android-test-only
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/rekka-android-icon-fullbleed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Garde Cloudflare en lecture seule, avant publication
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/kairo/scripts/verify-android-isolation.py preflight
      - name: Verifier le perimetre autorise
        run: |
          test -z "$(git diff 0d526ac52e095f3dd4bc3d2e6a3c9278073ee883 HEAD -- apps/kairo/src packages apps/kairo/public apps/kairo/index.html apps/kairo/vite.config.ts)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec eslint apps/kairo/scripts/prepare-android-test.mjs apps/kairo/scripts/e2e-android-icons.mjs
      - run: pnpm kairo:build:beta
      - name: Preparer uniquement ESSAI
        working-directory: apps/kairo
        run: node scripts/prepare-android-test.mjs
      - run: pnpm --filter @hybridsport/kairo exec playwright install --with-deps chromium
      # Await the new controller before asserting the exact release cache.
      - name: Migration worker, stockage intact, icones hors ligne et BETA isolee
        run: node apps/kairo/scripts/e2e-android-icons.mjs
      - name: Derniere garde isolation avant ecriture
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/kairo/scripts/verify-android-isolation.py prepublish
      - name: Publier uniquement le projet ESSAI existant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 pages deploy apps/kairo/dist-android-test --project-name=rekka-v2-android-test --branch=android-test --commit-hash="$GITHUB_SHA" --commit-dirty=true
      - name: Confirmer Cloudflare et absence de modification BETA production
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 apps/kairo/scripts/verify-android-isolation.py post
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rekka-fullbleed-mask-simulations
          path: apps/kairo/resources/android-test-icons/qa/android-masks.png
