name: REKKA V4 - Progression visual validation
on:
  push:
    branches: [codex/rekka-v4-progression-finition]
    paths:
      - 'apps/kairo/**'
      - '.github/workflows/rekka-v4-passe8-captures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captures:
    if: github.ref == 'refs/heads/codex/rekka-v4-progression-finition'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      VITE_REKKA_VISUAL_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint
      - name: Kairo regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p passe8-qa
          pnpm exec vitest run apps/kairo/tests --maxWorkers=2 | tee passe8-qa/tests.log
      - run: pnpm kairo:build:beta
        env:
          GITHUB_SHA: ${{ github.sha }}
      - run: /usr/bin/google-chrome --version
      - name: Capture all three zones and mobile sizes
        shell: bash
        run: |
          set -euo pipefail
          for zone in upper lower full; do
            REKKA_PROGRESS_REFERENCE=1 REKKA_WORKOUT_REFERENCE=1 REKKA_WORKOUT_ZONE="$zone" node apps/kairo/scripts/e2e-v4-screens.mjs "passe8-qa/$zone"
          done
      - name: Compile and capture baseline for Home comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fc92d32a9d27edc0acac53820d5a9de6ad9d350e
          git checkout fc92d32a9d27edc0acac53820d5a9de6ad9d350e -- apps/kairo/src
          git show fc92d32a9d27edc0acac53820d5a9de6ad9d350e:apps/kairo/scripts/e2e-v4-screens.mjs > apps/kairo/scripts/passe8-baseline.mjs
          pnpm kairo:build:beta
          REKKA_WORKOUT_REFERENCE=1 node apps/kairo/scripts/passe8-baseline.mjs passe8-qa/before
          git checkout HEAD -- apps/kairo/src
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rekka-v4-passe8-captures
          path: passe8-qa/
          retention-days: 30
          if-no-files-found: warn
